# Copy this file to math.yaml / code.yaml / medical.yaml / science.yaml.
# Keep every optimization field identical across siblings; change only domain/data/output_dir.
model_name: Qwen/Qwen3-4B-Base
domain: Math
output_dir: runs/experts/math
seed: 42
trust_remote_code: true
torch_dtype: bfloat16
qlora_4bit: true
bnb_4bit_quant_type: nf4
bnb_compute_dtype: bfloat16
bnb_double_quant: true
gradient_checkpointing: true
max_seq_length: 2048

data:
  # Either name/config_name for HF datasets OR path for local JSON/JSONL.
  path: data/training/math_train.jsonl
  split: train
  prompt_field: prompt
  response_field: response
  mask_prompt_loss: true
  use_chat_template: false
  template: "{prompt}\n{response}"
  max_examples: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  # Qwen-family common attention/MLP projections; verify against the exact checkpoint.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  epochs: 1.0
  max_steps: -1
  batch_size: 1
  grad_accum: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler: cosine
  logging_steps: 10
  save_strategy: steps
  save_steps: 250
  save_total_limit: 2
  bf16: true
  fp16: false
  report_to: none

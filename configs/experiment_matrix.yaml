functional_validity:
  parents:
  - math
  - code
  - medical
  subsets:
  - []
  - - math
  - - code
  - - medical
  - - math
    - code
  - - math
    - medical
  - - code
    - medical
  - - math
    - code
    - medical
  utility_domains:
  - math
  - code
  - medical
  - macro
calibration_protocol:
  cal_signal:
    control_families:
    - bf16_base_episodes
    - int8_base_episodes
    - int4_base_episodes
    - no_task_delta_adapter_controls
    planned_scores: 40
    unit: independent audit episodes / transformation-matched null controls
  cal_support:
    heldout_known_compositions: 24
  cal_open:
    candidate_bank_complete_descendants: 50
    target_retained_signal_pass_scores: 40
    transformation_families:
    - adapter_merge
    heavy_shift_families:
    - task_vector_merge
    - merge_sft_light
    - quant_kd
    - deep_chain
    note: G0 finite-sample calibration uses executable weighted-adapter composition
      only; task-vector/SFT/KD/deep-chain are transfer/shift tests unless separately
      matched-calibrated.
  alphas:
    main: 0.05
    sensitivity:
    - 0.1
    optional_0p01_requires_n_ge: 100
negative_controls:
  genealogy_label_permutations: 2000
  probe_pair_shuffle:
    enabled: true
    within_domain: true
  low_signal_alphas:
  - 0.05
  - 0.1
  optional_alpha_0p01_requires_n_ge: 100
bootstrap:
  representative_settings:
  - clean_merge
  - multi_teacher_kd
  - deep_chain
  n_boot: 1000
  support_frequency_threshold: 0.8

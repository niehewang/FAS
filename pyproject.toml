[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fas-ancestry"
version = "1.0.0"
description = "Functional Ancestry Simplex for API-only multi-parent functional ancestry decomposition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Hewang Nie"},
  {name = "Jue Xiao"},
  {name = "Zhi Lu"},
  {name = "Renfei Shen"},
  {name = "Zhenjun Tang"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["fas_core*"]
